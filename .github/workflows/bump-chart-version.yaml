name: Bump chart version

on:
  repository_dispatch:
    types: [tangle-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-chart-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Install helm-docs
        run: |
          curl -sSL \
            https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin helm-docs

      - name: Bump Chart.yaml
        id: bump
        run: |
          RAW_VERSION="${{ github.event.client_payload.version }}"
          APP_VERSION="${RAW_VERSION#v}"
          CHART_FILE="charts/tangle/Chart.yaml"

          PREV_APP_VERSION="$(yq '.appVersion' "$CHART_FILE")"
          CURRENT_CHART_VERSION="$(yq '.version' "$CHART_FILE")"

          # The chart bump mirrors the app bump (major/minor/patch), so the chart version
          # signals how significant the release it ships is. See scripts/next-chart-version.sh.
          BUMP="$(scripts/next-chart-version.sh \
            "$PREV_APP_VERSION" "$APP_VERSION" "$CURRENT_CHART_VERSION")"
          RELEASE_TYPE="${BUMP%% *}"
          NEW_CHART_VERSION="${BUMP##* }"

          yq -i ".appVersion = \"${APP_VERSION}\"" "$CHART_FILE"
          yq -i ".version = \"${NEW_CHART_VERSION}\"" "$CHART_FILE"

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${NEW_CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_type=${RELEASE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bump values.yaml image tag
        # Chart.yaml alone isn't enough: values.yaml pins image.tag explicitly, which
        # overrides the deployment template's `| default .Chart.AppVersion` fallback, so
        # bumping appVersion on its own leaves the chart deploying the *previous* image.
        # The raw tag is used here, `v` prefix and all -- ghcr.io/ivanklee86/tangle
        # publishes only v-prefixed tags, so appVersion ("0.3.0") is not a pullable tag.
        env:
          IMAGE_TAG: ${{ steps.bump.outputs.image_tag }}
        run: |
          VALUES_FILE="charts/tangle/values.yaml"

          # A targeted edit of the `tag:` line inside the top-level `image:` block, rather
          # than `yq -i`: yq rewrites the whole document, dropping every blank line and
          # re-indenting this file's commented-out example blocks -- a ~60 line diff for a
          # one-line change.
          awk -v tag="$IMAGE_TAG" '
            /^[^[:space:]#]/ { in_image = ($0 ~ /^image:[[:space:]]*$/) }
            in_image && /^[[:space:]]+tag:[[:space:]]/ { sub(/tag:.*/, "tag: \"" tag "\"") }
            { print }
          ' "$VALUES_FILE" > "$VALUES_FILE.tmp"
          mv "$VALUES_FILE.tmp" "$VALUES_FILE"

          # Verify with yq, so a values.yaml restructure that the awk above no longer
          # matches fails the run instead of quietly opening a PR that bumps nothing.
          ACTUAL_TAG="$(yq '.image.tag' "$VALUES_FILE")"
          if [ "$ACTUAL_TAG" != "$IMAGE_TAG" ]; then
            echo "::error::expected image.tag to be ${IMAGE_TAG}, got ${ACTUAL_TAG}"
            exit 1
          fi

      - name: Regenerate chart README
        # helm-docs renders the Version/AppVersion badges (and any other Chart.yaml-derived
        # content) in charts/tangle/README.md, so it needs to re-run whenever Chart.yaml
        # changes -- otherwise the badges keep showing the pre-bump versions.
        run: helm-docs
        working-directory: charts/tangle

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # A PAT, not the default GITHUB_TOKEN: a PR authored by github-actions[bot] has
          # author_association "CONTRIBUTOR" on this public repo, which GitHub gates behind
          # manual approval before any pull_request-triggered workflow (our "chart" CI
          # check) will run at all -- defeating the point of auto-merging this PR. Using a
          # PAT makes the PR's author the token owner (an OWNER/COLLABORATOR), which isn't
          # gated.
          token: ${{ secrets.CHART_BUMP_PAT }}
          commit-message: "chore: bump chart to appVersion ${{ steps.bump.outputs.app_version }}"
          title: "chore: bump chart to appVersion ${{ steps.bump.outputs.app_version }}"
          body: |
            Automated bump triggered by
            [`tangle` ${{ github.event.client_payload.version }}](https://github.com/ivanklee86/tangle/releases/tag/${{ github.event.client_payload.version }}).

            - `appVersion`: `${{ steps.bump.outputs.app_version }}`
            - `version`: `${{ steps.bump.outputs.chart_version }}` (`${{ steps.bump.outputs.release_type }}` bump)
            - `image.tag`: `${{ steps.bump.outputs.image_tag }}`
          branch: chore/bump-chart-appversion
          delete-branch: true
          labels: automated

      - name: Enable auto-merge
        # The PAT, not GITHUB_TOKEN: GitHub also suppresses the pull_request:closed /
        # push events that would otherwise fire once this merge completes when the merge
        # itself is GITHUB_TOKEN-authenticated (same anti-recursion rule that requires the
        # PAT above for opening the PR) -- which would leave release.yaml's `push: main`
        # trigger never firing for this PR's own merge. A PAT-authenticated merge behaves
        # like an ordinary user merge and triggers it normally.
        if: steps.pr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.CHART_BUMP_PAT }}
